name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the run already in flight, so CI is
# never queued behind results nobody is waiting for any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    env:
      # The app's lifespan creates tables against DATABASE_URL on startup, so
      # the test client needs a reachable database even though every request is
      # overridden onto SQLite. Pointing it at a scratch SQLite file keeps CI
      # free of a Postgres service container.
      DATABASE_URL: sqlite:///./ci.db
      JWT_SECRET: ci-only-not-a-real-secret
      # Keep the suite off the network — no OSV.dev advisory lookups in CI.
      ENABLE_DEPENDENCY_SCAN: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        # Invoked from the project root: backend is a package, so its modules
        # only resolve from here.
        run: python -m pytest backend/tests -q

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check and build
        run: npm run build
