name: CodeScope

# Runs CodeScope against its own pull requests and posts the report as a
# comment. This is the same pipeline as the webhook in routers/webhooks.py, but
# driven from CI instead of a running backend — which means it needs no server,
# no ngrok tunnel and no webhook secret.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write   # required to post the comment

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    name: Analyse pull request
    runs-on: ubuntu-latest

    env:
      # Behavioural analysis reads the commit log, so the dependency scan is the
      # only thing needing the network. Leave it on: OSV.dev advisories are one
      # of the more useful things in the report.
      ENABLE_DEPENDENCY_SCAN: "true"

    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4
        with:
          # Full history: churn, hotspots, coupling and bus factor are all
          # derived from the commit log, and the default depth-1 checkout has
          # none. This also makes the base branch available for the diff.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run analysis
        id: analysis
        run: |
          python -m backend.cli \
            --path . \
            --repo-name "${{ github.event.repository.name }}" \
            --baseline-ref "origin/${{ github.base_ref }}" \
            --comment-out comment.md \
            --gate-out gate.json \
            --no-fail-on-gate

      - name: Post the report to the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- codescope-analysis-report -->';
            const body = marker + '\n' + fs.readFileSync('comment.md', 'utf8');

            // Sticky comment: edit the existing report rather than stacking a
            // new one under the PR on every push.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => (c.body || '').includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Enforce the quality gate
        run: |
          state=$(python -c "import json; print(json.load(open('gate.json'))['state'])")
          description=$(python -c "import json; print(json.load(open('gate.json'))['description'])")
          echo "Quality gate: $state — $description"
          # Reported after the comment is posted, so a failing gate still leaves
          # the author the report explaining why.
          if [ "$state" = "failure" ]; then
            echo "::error::Quality gate failed — $description"
            exit 1
          fi
